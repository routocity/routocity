<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Routocity — 서울 걷기·달리기 코스</title>
<meta name="description" content="서울 주요 동네의 걷기·달리기·산책 코스. 맛집, 쉼터, 무료 화장실 정보 무료 제공. Free walking & running courses in Seoul.">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --g:#1D9E75;--gl:#E1F5EE;--gd:#085041;
  --b:#185FA5;--bl:#E6F1FB;
  --c:#D85A30;--cl:#FAECE7;
  --a:#BA7517;--al:#FAEEDA;
  --pk:#993356;--pkl:#FBEAF0;
  --bg:#f5f7f6;--sur:#fff;
  --bor:rgba(0,0,0,0.09);--bors:rgba(0,0,0,0.16);
  --tx:#1a1a1a;--txs:#555;--txt:#999;
  --r:12px;--rl:18px;
  --nav:60px;--top:56px;
}
html,body{height:100%;overflow:hidden;font-family:'Noto Sans KR','Inter',sans-serif;background:var(--bg);color:var(--tx)}

/* ── TOP BAR ── */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--top);background:var(--sur);border-bottom:1px solid var(--bor);display:flex;align-items:center;padding:0 14px;gap:10px}
.logo{display:flex;align-items:center;gap:7px;font-size:20px;font-weight:700;color:var(--gd);white-space:nowrap}
.logo i{color:var(--g);font-size:22px}
.search-wrap{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bor);border-radius:100px;padding:0 13px;height:38px}
.search-wrap input{border:none;background:transparent;flex:1;font-size:14px;color:var(--tx);outline:none;font-family:inherit}
.search-wrap input::placeholder{color:var(--txt)}
.lang-btn{padding:7px 12px;border:1px solid var(--bor);border-radius:100px;font-size:13px;color:var(--txs);background:var(--sur);cursor:pointer;white-space:nowrap;font-family:inherit}

/* ── DISTRICT SCROLL ── */
.district-bar{position:fixed;top:var(--top);left:0;right:0;z-index:99;background:var(--sur);border-bottom:1px solid var(--bor);display:flex;overflow-x:auto;scrollbar-width:none;height:52px;align-items:center}
.district-bar::-webkit-scrollbar{display:none}
.dtab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;flex-shrink:0;min-width:56px}
.dtab i{font-size:17px;color:var(--txt)}
.dtab span{font-size:10px;color:var(--txt)}
.dtab.active i,.dtab.active span{color:var(--g)}
.dtab.active span{font-weight:600}
.dtab.active{border-bottom-color:var(--g)}

/* ── MAIN CONTENT AREA ── */
.content{position:fixed;top:108px;bottom:var(--nav);left:0;right:0;display:flex;flex-direction:column;overflow:hidden}

/* ── TAB SWITCHER (map/list) ── */
.view-tabs{display:flex;background:var(--sur);border-bottom:1px solid var(--bor);flex-shrink:0}
.vtab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:500;color:var(--txt);border-bottom:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.vtab i{font-size:15px}
.vtab.active{color:var(--g);border-bottom-color:var(--g)}

/* ── MAP VIEW ── */
.map-view{flex:1;position:relative;display:none}
.map-view.active{display:flex;flex-direction:column}
.map-view iframe{flex:1;border:none;width:100%}
.map-gmap-btn{position:absolute;top:10px;right:10px;background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);padding:9px 14px;font-size:13px;font-weight:500;color:var(--g);display:none;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,0.12);cursor:pointer;font-family:inherit}
.map-gmap-btn.show{display:flex}

/* ── LIST VIEW ── */
.list-view{flex:1;overflow-y:auto;display:none;padding:10px 12px 4px}
.list-view.active{display:block}

/* ── TYPE FILTER CHIPS ── */
.type-chips{display:flex;gap:7px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none;flex-shrink:0;background:var(--bg)}
.type-chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:100px;border:1px solid var(--bor);font-size:13px;color:var(--txs);background:var(--sur);cursor:pointer;white-space:nowrap;font-family:inherit;font-weight:500}
.chip i{font-size:14px}
.chip.active{background:var(--gl);border-color:var(--g);color:var(--gd)}

/* ── COURSE CARDS ── */
.course-card{background:var(--sur);border:1px solid var(--bor);border-radius:var(--rl);padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color 0.15s,box-shadow 0.15s;active:scale(0.98)}
.course-card:active{transform:scale(0.99)}
.course-card.selected{border-color:var(--g);border-width:1.5px;background:var(--gl)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:9px}
.card-title{font-size:15px;font-weight:600;color:var(--tx);line-height:1.35}
.type-badge{display:flex;align-items:center;gap:3px;font-size:11px;padding:4px 9px;border-radius:100px;white-space:nowrap;flex-shrink:0;font-weight:600}
.card-meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:9px}
.meta-item{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--txs)}
.meta-item i{font-size:14px}
.card-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 8px;border-radius:100px;background:var(--bg);color:var(--txt)}

/* ── BOTTOM SHEET (course detail) ── */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:200;pointer-events:none;transition:background 0.3s}
.sheet-overlay.open{background:rgba(0,0,0,0.35);pointer-events:auto}
.bottom-sheet{position:fixed;bottom:var(--nav);left:0;right:0;z-index:201;background:var(--sur);border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,0.18);transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);max-height:80vh;overflow-y:auto;padding:0 16px 16px}
.bottom-sheet.open{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:var(--bors);border-radius:2px;margin:12px auto 14px}
.sheet-title{font-size:17px;font-weight:700;color:var(--tx);margin-bottom:4px}
.sheet-tags{font-size:12px;color:var(--txt);margin-bottom:14px;line-height:1.7}
.sheet-steps{display:flex;align-items:flex-start;gap:0;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;scrollbar-width:none}
.sheet-steps::-webkit-scrollbar{display:none}
.step-node{text-align:center;flex-shrink:0;width:72px}
.step-circle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 5px;font-size:18px}
.step-label{font-size:11px;font-weight:600;color:var(--tx);line-height:1.3;word-break:keep-all}
.step-note{font-size:10px;color:var(--txt);margin-top:2px}
.step-line{width:16px;height:2px;margin-bottom:28px;flex-shrink:0;opacity:0.3;align-self:flex-start;margin-top:20px}
.sheet-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-box{background:var(--bg);border-radius:var(--r);padding:10px 6px;text-align:center}
.stat-val{font-size:15px;font-weight:700;color:var(--tx)}
.stat-lbl{font-size:10px;color:var(--txt);margin-top:2px}
.poi-section-title{font-size:13px;font-weight:600;color:var(--txs);margin-bottom:10px}
.poi-list{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.poi-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--bor);background:var(--sur)}
.poi-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.poi-name{font-size:13px;font-weight:600;color:var(--tx)}
.poi-desc{font-size:11px;color:var(--txt);margin-top:1px}
.sheet-actions{display:flex;gap:8px}
.btn-main{flex:1;padding:14px;background:var(--g);color:#fff;border:none;border-radius:var(--rl);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit}
.btn-main i{font-size:17px}
.btn-main:active{background:var(--gd)}
.btn-sub{padding:14px 16px;background:var(--bg);border:1px solid var(--bor);border-radius:var(--rl);font-size:14px;cursor:pointer;color:var(--tx);font-family:inherit;white-space:nowrap}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:300;height:var(--nav);background:var(--sur);border-top:1px solid var(--bor);display:flex;align-items:center}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;cursor:pointer}
.nav-item i{font-size:22px;color:var(--txt)}
.nav-item span{font-size:10px;color:var(--txt)}
.nav-item.active i,.nav-item.active span{color:var(--g)}
.nav-item.active span{font-weight:600}

/* ── DONATE BAR ── */
.donate-bar{background:var(--gl);border-top:1px solid #9FE1CB;padding:9px 14px;display:flex;align-items:center;gap:7px;flex-shrink:0}
.donate-bar i{color:var(--g);font-size:15px;flex-shrink:0}
.donate-bar span{font-size:11px;color:var(--gd);line-height:1.4}

/* ── EMPTY STATE ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;gap:10px}
.empty i{font-size:44px;color:var(--txt);opacity:0.4}
.empty p{font-size:14px;color:var(--txt)}

/* ── PC LAYOUT (768px+) ── */
@media(min-width:768px){
  .content{flex-direction:row}
  .view-tabs{display:none}
  .map-view{display:flex!important;flex:1}
  .list-panel{width:340px;flex-shrink:0;display:flex;flex-direction:column;background:var(--sur);border-right:1px solid var(--bor);overflow:hidden}
  .list-view{display:block!important;flex:1;padding:10px}
  .type-chips{background:var(--sur);border-bottom:1px solid var(--bor)}
  .bottom-nav{display:none}
  .bottom-sheet{bottom:0;max-height:60vh}
  body{overflow:hidden}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo"><i class="ti ti-route-2" aria-hidden="true"></i>Routocity</div>
  <div class="search-wrap">
    <i class="ti ti-search" style="color:var(--txt);font-size:15px" aria-hidden="true"></i>
    <input id="searchInput" type="text" placeholder="코스·장소·태그 검색...">
  </div>
  <button class="lang-btn" id="langBtn" onclick="toggleLang()">EN</button>
</div>

<!-- DISTRICT BAR -->
<div class="district-bar" id="districtBar"></div>

<!-- MAIN CONTENT -->
<div class="content">

  <!-- PC: 왼쪽 패널 / 모바일: 탭 전환 -->
  <div class="list-panel" id="listPanel">
    <!-- 타입 필터 -->
    <div class="type-chips" id="typeChips">
      <button class="chip active" data-type="all"><i class="ti ti-layout-grid" aria-hidden="true"></i><span class="t" data-ko="전체" data-en="All"></span></button>
      <button class="chip" data-type="walk"><i class="ti ti-walk" aria-hidden="true"></i><span class="t" data-ko="걷기" data-en="Walk"></span></button>
      <button class="chip" data-type="run"><i class="ti ti-run" aria-hidden="true"></i><span class="t" data-ko="달리기" data-en="Run"></span></button>
      <button class="chip" data-type="meal"><i class="ti ti-bowl-spoon" aria-hidden="true"></i><span class="t" data-ko="식후산책" data-en="Post-meal"></span></button>
      <button class="chip" data-type="pet"><i class="ti ti-paw" aria-hidden="true"></i><span class="t" data-ko="반려동물" data-en="Pet"></span></button>
      <button class="chip" data-type="travel"><i class="ti ti-plane" aria-hidden="true"></i><span class="t" data-ko="여행자" data-en="Traveler"></span></button>
    </div>
    <!-- 코스 목록 -->
    <div class="list-view active" id="courseList"></div>
    <!-- 기부 배너 -->
    <div class="donate-bar">
      <i class="ti ti-heart" aria-hidden="true"></i>
      <span class="t" data-ko="광고 수익 일부는 지역 아이들을 위해 기부됩니다 💚" data-en="Ad revenue partially donated for local children 💚"></span>
    </div>
  </div>

  <!-- 지도/목록 탭 (모바일) -->
  <div class="view-tabs" id="viewTabs">
    <div class="vtab active" id="tabList" onclick="switchView('list')">
      <i class="ti ti-list" aria-hidden="true"></i>
      <span class="t" data-ko="코스 목록" data-en="Courses"></span>
    </div>
    <div class="vtab" id="tabMap" onclick="switchView('map')">
      <i class="ti ti-map-2" aria-hidden="true"></i>
      <span class="t" data-ko="지도" data-en="Map"></span>
    </div>
  </div>

  <!-- 지도 -->
  <div class="map-view active" id="mapView">
    <iframe id="mapFrame"
      src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d50000!2d126.978!3d37.563!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sko!2skr!4v1700000000000"
      allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade">
    </iframe>
    <button class="map-gmap-btn" id="gmapBtn" onclick="openGmap()">
      <i class="ti ti-brand-google-maps" aria-hidden="true"></i>
      <span class="t" data-ko="구글맵으로 열기" data-en="Open in Google Maps"></span>
    </button>
  </div>

</div>

<!-- BOTTOM SHEET (코스 상세) -->
<div class="sheet-overlay" id="overlay" onclick="closeSheet()"></div>
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="sheetTitle"></div>
  <div class="sheet-tags" id="sheetTags"></div>
  <div class="sheet-steps" id="sheetSteps"></div>
  <div class="sheet-stats" id="sheetStats"></div>
  <div class="poi-section-title t" data-ko="코스 주변 정보" data-en="Along this route"></div>
  <div class="poi-list" id="sheetPOI"></div>
  <div class="sheet-actions">
    <button class="btn-main" onclick="openGmap()">
      <i class="ti ti-brand-google-maps" aria-hidden="true"></i>
      <span class="t" data-ko="구글맵으로 길 안내" data-en="Navigate in Google Maps"></span>
    </button>
    <button class="btn-sub t" data-ko="닫기" data-en="Close" onclick="closeSheet()"></button>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <div class="nav-item active" onclick="switchView('list')">
    <i class="ti ti-list" aria-hidden="true"></i>
    <span class="t" data-ko="코스" data-en="Courses"></span>
  </div>
  <div class="nav-item" onclick="switchView('map')">
    <i class="ti ti-map-2" aria-hidden="true"></i>
    <span class="t" data-ko="지도" data-en="Map"></span>
  </div>
  <div class="nav-item" onclick="focusSearch()">
    <i class="ti ti-search" aria-hidden="true"></i>
    <span class="t" data-ko="검색" data-en="Search"></span>
  </div>
  <div class="nav-item" onclick="switchLang()">
    <i class="ti ti-world" aria-hidden="true"></i>
    <span id="langNavLabel">EN</span>
  </div>
</nav>

<script>

  {id:'g2',district:'gangnam',type:'meal',
   ko:{name:'선정릉 식후 소화 산책',tags:['식후산책','혈당관리','선정릉','직장인']},

   dist:'1.8km',time:{ko:'22분',en:'22 min'},cal:'80kcal',diff:{ko:'쉬움',en:'Easy'},
   steps:[

// ── DISTRICT BAR ──────────────────────────────
function buildDistricts(){
  const bar=document.getElementById('districtBar');
  bar.innerHTML=DISTRICTS.map(d=>`
    <div class="dtab ${d.id===activeDistrict?'active':''}" data-d="${d.id}">
      <i class="ti ${d.icon}"></i>
      <span>${d[lang]}</span>
    </div>`).join('');
  bar.querySelectorAll('.dtab').forEach(el=>{
    el.addEventListener('click',()=>{
      activeDistrict=el.dataset.d;
      selectedId=null;
      closeSheet();
      buildDistricts();
      renderList();
    });
  });
}

// ── TYPE CHIPS ──────────────────────────────────
document.getElementById('typeChips').addEventListener('click',e=>{
  const btn=e.target.closest('[data-type]');
  if(!btn)return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  activeType=btn.dataset.type;
  selectedId=null;
  closeSheet();
  renderList();
});

// ── RENDER LIST ──────────────────────────────────
function renderList(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const filtered=COURSES.filter(c=>{
    const dOk=activeDistrict==='all'||c.district===activeDistrict;
    const tOk=activeType==='all'||c.type===activeType;
    const loc=c[lang];
    const qOk=!q||loc.name.toLowerCase().includes(q)||loc.tags.some(t=>t.toLowerCase().includes(q));
    return dOk&&tOk&&qOk;
  });
  const list=document.getElementById('courseList');
  if(filtered.length===0){
    list.innerHTML=`<div class="empty"><i class="ti ti-map-search"></i><p>${lang==='ko'?'코스가 없어요. 다른 조건을 선택해보세요.':'No courses found. Try other filters.'}</p></div>`;
    return;
  }
  list.innerHTML=filtered.map(c=>{
    const ti=TI[c.type];
    const loc=c[lang];
    const sel=selectedId===c.id;
    return`<div class="course-card${sel?' selected':''}" data-id="${c.id}">
      <div class="card-top">
        <div class="card-title">${loc.name}</div>
        <div class="type-badge" style="background:${ti.bg};color:${ti.fg}"><i class="ti ${ti.icon}"></i>${ti[lang]}</div>
      </div>
      <div class="card-meta">
        <span class="meta-item"><i class="ti ti-map-pin"></i>${c.dist}</span>
        <span class="meta-item"><i class="ti ti-clock"></i>${c.time[lang]}</span>
        <span class="meta-item"><i class="ti ti-flame"></i>${c.cal}</span>
        <span class="meta-item"><i class="ti ti-stairs"></i>${c.diff[lang]}</span>
      </div>
      <div class="card-tags">${(loc.tags||[]).map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
    </div>`;
  }).join('');
  list.querySelectorAll('.course-card').forEach(el=>{
    el.addEventListener('click',()=>selectCourse(el.dataset.id));
  });
}

// ── SELECT COURSE ──────────────────────────────
function selectCourse(id){
  selectedId=id;
  const c=COURSES.find(x=>x.id===id);
  const loc=c[lang];

  // 지도 업데이트
  document.getElementById('mapFrame').src=c.mapSrc;
  document.getElementById('gmapBtn').classList.add('show');

  // 바텀시트 채우기
  document.getElementById('sheetTitle').textContent=loc.name;
  document.getElementById('sheetTags').textContent=(loc.tags||[]).map(t=>'#'+t).join('  ');

  // 경유지
  const color={gangnam:'#1D9E75',seongsu:'#185FA5',hongdae:'#993356',itaewon:'#D85A30',insadong:'#BA7517',gwanghwa:'#085041',jamsil:'#7F77DD'}[c.district]||'#1D9E75';
  document.getElementById('sheetSteps').innerHTML=(c.steps||[]).map((s,i)=>`
    <div class="step-node">
      <div class="step-circle" style="background:${color}22;border:2px solid ${color}">
        <i class="ti ${s.icon}" style="color:${color};font-size:18px"></i>
      </div>
      <div class="step-label">${s[lang]||s.ko}</div>
      <div class="step-note">${s.note[lang]}</div>
    </div>
    ${i<c.steps.length-1?`<div class="step-line" style="background:${color}"></div>`:''}`).join('');

  // 통계
  document.getElementById('sheetStats').innerHTML=[
    ['ti-map-pin',c.dist,lang==='ko'?'거리':'Distance'],
    ['ti-clock',c.time[lang],lang==='ko'?'시간':'Time'],
    ['ti-flame',c.cal,lang==='ko'?'칼로리':'Calories'],
    ['ti-stairs',c.diff[lang],lang==='ko'?'난이도':'Level'],
  ].map(([ic,v,l])=>`<div class="stat-box"><div class="stat-val">${v}</div><div class="stat-lbl">${l}</div></div>`).join('');

  // POI
  document.getElementById('sheetPOI').innerHTML=(c.pois||[]).map(p=>{
    const ps=POI_S[p.type]||POI_S.rest;
    const [name,desc]=p[lang];
    return`<div class="poi-item">
      <div class="poi-icon" style="background:${ps.bg};color:${ps.fg}"><i class="ti ${p.icon}"></i></div>
      <div><div class="poi-name">${name}</div><div class="poi-desc">${desc}</div></div>
    </div>`;
  }).join('');

  document.querySelector('.poi-section-title').textContent=lang==='ko'?'코스 주변 정보':'Along this route';
  document.querySelector('.btn-sub').textContent=lang==='ko'?'닫기':'Close';

  // 바텀시트 열기
  document.getElementById('overlay').classList.add('open');
  document.getElementById('bottomSheet').classList.add('open');

  // 모바일: 지도 뷰로 전환
  if(window.innerWidth<768) switchView('map');

  renderList();
}

function closeSheet(){
  selectedId=null;
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('bottomSheet').classList.remove('open');
  document.getElementById('gmapBtn').classList.remove('show');
  renderList();
}

function openGmap(){
  if(!selectedId)return;
  window.open(COURSES.find(c=>c.id===selectedId).gmapUrl,'_blank');
}

// ── VIEW SWITCH (모바일) ──────────────────────────
function switchView(v){
  currentView=v;
  const mapV=document.getElementById('mapView');
  const listV=document.getElementById('courseList').closest('.list-view')||document.getElementById('courseList');
  const listPanel=document.getElementById('listPanel');
  const tabList=document.getElementById('tabList');
  const tabMap=document.getElementById('tabMap');

  if(window.innerWidth>=768)return;

  if(v==='map'){
    mapV.classList.add('active');
    listPanel.style.display='none';
    tabList&&tabList.classList.remove('active');
    tabMap&&tabMap.classList.add('active');
    document.querySelectorAll('.nav-item').forEach((n,i)=>{n.classList.toggle('active',i===1)});
  } else {
    mapV.classList.remove('active');
    listPanel.style.display='flex';
    tabList&&tabList.classList.add('active');
    tabMap&&tabMap.classList.remove('active');
    document.querySelectorAll('.nav-item').forEach((n,i)=>{n.classList.toggle('active',i===0)});
  }
}

// 초기 모바일 설정
function initMobile(){
  if(window.innerWidth<768){
    document.getElementById('mapView').classList.remove('active');
    document.getElementById('listPanel').style.display='flex';
    const tc=document.getElementById('typeChips');
    const lv=document.querySelector('.list-view');
    if(tc&&lv){
      document.getElementById('listPanel').insertBefore(tc,lv);
    }
  }
}

// ── LANGUAGE ──────────────────────────────────
function toggleLang(){
  lang=lang==='ko'?'en':'ko';
  applyLang();
}
function switchLang(){toggleLang();}
function applyLang(){
  document.getElementById('langBtn').textContent=lang==='ko'?'EN':'한국어';
  document.getElementById('langNavLabel').textContent=lang==='ko'?'EN':'KO';
  document.getElementById('searchInput').placeholder=lang==='ko'?'코스·장소·태그 검색...':'Search courses, places, tags...';
  document.querySelectorAll('[data-ko]').forEach(el=>{
    el.textContent=el.dataset[lang]||el.dataset.ko;
  });
  buildDistricts();
  renderList();
  if(selectedId)selectCourse(selectedId);
}

function focusSearch(){
  document.getElementById('searchInput').focus();
  document.querySelectorAll('.nav-item').forEach((n,i)=>{n.classList.toggle('active',i===2)});
}

// ── SEARCH ──────────────────────────────────────
document.getElementById('searchInput').addEventListener('input',renderList);

// ── INIT ──────────────────────────────────────
initMobile();
buildDistricts();
applyLang();
</script>
</body>
</html>
