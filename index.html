<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Routocity — 서울 걷기·달리기 코스</title>
<meta name="description" content="서울 주요 동네의 걷기·달리기·산책 코스. 맛집·쉼터·화장실 무료 정보. Free walking & running courses in Seoul.">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:#f5f7f6;color:#1a1a1a}
.topbar{background:#fff;border-bottom:1px solid rgba(0,0,0,.1);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.logo{font-size:19px;font-weight:700;color:#085041;display:flex;align-items:center;gap:6px;white-space:nowrap}
.logo i{color:#1D9E75;font-size:20px}
.search{flex:1;display:flex;align-items:center;gap:7px;background:#f5f7f6;border:1px solid rgba(0,0,0,.1);border-radius:100px;padding:0 13px;height:38px}
.search input{border:none;background:transparent;flex:1;font-size:14px;color:#1a1a1a;outline:none;font-family:inherit}
.search input::placeholder{color:#999}
.lbtn{padding:7px 11px;border:1px solid rgba(0,0,0,.1);border-radius:100px;font-size:13px;color:#555;background:#fff;cursor:pointer;font-family:inherit}
.dbar{background:#fff;border-bottom:1px solid rgba(0,0,0,.1);display:flex;overflow-x:auto;scrollbar-width:none;position:sticky;top:58px;z-index:49}
.dbar::-webkit-scrollbar{display:none}
.dtab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 13px;cursor:pointer;border-bottom:2.5px solid transparent;flex-shrink:0;min-width:50px}
.dtab i{font-size:16px;color:#999}
.dtab span{font-size:10px;color:#999}
.dtab.on i,.dtab.on span{color:#1D9E75;font-weight:600}
.dtab.on{border-bottom-color:#1D9E75}
.vtbar{background:#fff;display:flex;border-bottom:1px solid rgba(0,0,0,.1);position:sticky;top:110px;z-index:48}
.vtab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;font-size:14px;font-weight:500;color:#999;border-bottom:2px solid transparent;cursor:pointer}
.vtab i{font-size:16px}
.vtab.on{color:#1D9E75;border-bottom-color:#1D9E75}
#listScreen{display:block}
#mapScreen{display:none}
.chips{display:flex;gap:7px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;background:#f5f7f6}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:5px;padding:7px 13px;border-radius:100px;border:1px solid rgba(0,0,0,.1);font-size:13px;font-weight:500;color:#555;background:#fff;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip i{font-size:14px}
.chip.on{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.clist{padding:8px 12px 40px}
.card{background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.card:active{transform:scale(0.99)}
.card.on{border:1.5px solid #1D9E75;background:#E1F5EE}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:9px}
.cname{font-size:15px;font-weight:600;color:#1a1a1a;line-height:1.35}
.cbadge{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:100px;white-space:nowrap;flex-shrink:0}
.cmeta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:9px}
.mi{display:flex;align-items:center;gap:4px;font-size:13px;color:#555}
.mi i{font-size:14px}
.ctags{display:flex;gap:5px;flex-wrap:wrap}
.ctag{font-size:11px;padding:3px 8px;border-radius:100px;background:#f5f7f6;color:#999}
.donate{background:#E1F5EE;border-top:1px solid #9FE1CB;padding:9px 14px;display:flex;align-items:center;gap:7px}
.donate i{color:#1D9E75;font-size:15px;flex-shrink:0}
.donate span{font-size:11px;color:#085041;line-height:1.4}
.mapwrap{height:calc(100vh - 170px);position:relative}
.mapwrap iframe{width:100%;height:100%;border:none;display:block}
.gmapbtn{position:absolute;top:10px;right:10px;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:12px;padding:9px 14px;font-size:13px;font-weight:500;color:#1D9E75;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer;font-family:inherit}
.gmapbtn i{font-size:15px}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:100;pointer-events:none;transition:background .3s}
.ovl.on{background:rgba(0,0,0,.4);pointer-events:auto}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:101;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.18);transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);max-height:85vh;overflow-y:auto;padding:0 16px 32px}
.sheet.on{transform:translateY(0)}
.handle{width:40px;height:4px;background:rgba(0,0,0,.15);border-radius:2px;margin:12px auto 14px}
.sh-ttl{font-size:17px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.sh-tags{font-size:12px;color:#999;margin-bottom:14px;line-height:1.7}
.steps{display:flex;align-items:flex-start;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.snode{text-align:center;flex-shrink:0;width:72px}
.scirc{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 5px}
.slbl{font-size:11px;font-weight:600;color:#1a1a1a;line-height:1.3;word-break:keep-all}
.snote{font-size:10px;color:#999;margin-top:2px}
.sline{width:14px;height:2px;margin-top:20px;flex-shrink:0;opacity:.3}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sbox{background:#f5f7f6;border-radius:12px;padding:10px 6px;text-align:center}
.sval{font-size:15px;font-weight:700;color:#1a1a1a}
.slbl2{font-size:10px;color:#999;margin-top:2px}
.poi-ttl{font-size:13px;font-weight:600;color:#555;margin-bottom:10px}
.pois{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.poi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid rgba(0,0,0,.1)}
.poiic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.poinm{font-size:13px;font-weight:600;color:#1a1a1a}
.poids{font-size:11px;color:#999;margin-top:1px}
.acts{display:flex;gap:8px}
.btngo{flex:1;padding:14px;background:#1D9E75;color:#fff;border:none;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit}
.btngo:active{background:#085041}
.btngo i{font-size:17px}
.btncls{padding:14px 18px;background:#f5f7f6;border:1px solid rgba(0,0,0,.1);border-radius:16px;font-size:14px;cursor:pointer;color:#1a1a1a;font-family:inherit}
@media(min-width:768px){
  .vtbar{display:none}
  #listScreen,#mapScreen{display:block!important}
  .page{display:flex;height:calc(100vh - 110px)}
  #listScreen{width:340px;flex-shrink:0;overflow-y:auto;border-right:1px solid rgba(0,0,0,.1)}
  .clist{padding-bottom:10px}
  #mapScreen{flex:1}
  .mapwrap{height:100%}
  .sheet{bottom:0;max-height:55vh}
}
</style>
</head>
<body>
<div class="topbar">

    <div class="clist" id="clist"></div>
    <div class="donate"><i class="ti ti-heart"></i><span class="t" data-ko="광고 수익 일부는 지역 아이들을 위해 기부됩니다 💚" data-en="Ad revenue partially donated for local children 💚"></span></div>
  </div>
  <div id="mapScreen">

      <iframe id="mf" src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d50000!2d126.978!3d37.563!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sko!2skr!4v1700000000000" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

    </div>
  </div>
</div>
<div class="ovl" id="ovl" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">

  <div class="sh-ttl" id="shT"></div>
  <div class="sh-tags" id="shTg"></div>
  <div class="steps" id="shSt"></div>
  <div class="stats" id="shStat"></div>

  <div class="acts">
    <button class="btngo" onclick="openGmap()"><i class="ti ti-brand-google-maps"></i><span class="t" data-ko="구글맵으로 길 안내" data-en="Open in Google Maps"></span></button>
    <button class="btncls t" data-ko="닫기" data-en="Close" onclick="closeSheet()"></button>
  </div>
</div>

let lang='ko',district='all',type='all',sel=null;
const TI={walk:{ko:'걷기',en:'Walk',bg:'#E6F1FB',fg:'#185FA5',ic:'ti-walk'},run:{ko:'달리기',en:'Run',bg:'#E1F5EE',fg:'#085041',ic:'ti-run'},meal:{ko:'식후산책',en:'Post-meal',bg:'#FBEAF0',fg:'#993356',ic:'ti-bowl-spoon'},pet:{ko:'반려동물',en:'Pet',bg:'#FAEEDA',fg:'#854F0B',ic:'ti-paw'},travel:{ko:'여행자',en:'Traveler',bg:'#E1F5EE',fg:'#085041',ic:'ti-plane'}};
const PI={food:{bg:'#FAECE7',fg:'#D85A30'},rest:{bg:'#E1F5EE',fg:'#085041'},toilet:{bg:'#E6F1FB',fg:'#185FA5'}};
const DC={gangnam:'#1D9E75',seongsu:'#185FA5',hongdae:'#993356',itaewon:'#D85A30',insadong:'#BA7517',gwanghwa:'#085041',jamsil:'#7F77DD'};
function buildD(){document.getElementById('dbar').innerHTML=DIS.map(d=>`<div class="dtab${d.id===district?' on':''}" onclick="setD('${d.id}')"><i class="ti ${d.ic}"></i><span>${d[lang]}</span></div>`).join('')}
function setD(id){district=id;sel=null;closeSheet();buildD();renderList()}
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('[data-type]');if(!b)return;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');type=b.dataset.type;sel=null;closeSheet();renderList()});
function renderList(){
  const q=document.getElementById('si').value.toLowerCase();
  const f=CS.filter(c=>{
    const dOk=district==='all'||c.d===district;
    const tOk=type==='all'||c.t===type;
    const loc=c[lang];
    const qOk=!q||loc.n.toLowerCase().includes(q)||(loc.tags||[]).some(t=>t.toLowerCase().includes(q));
    return dOk&&tOk&&qOk;
  });
  const el=document.getElementById('clist');
  if(!f.length){el.innerHTML=`<div style="text-align:center;padding:48px 20px;color:#999"><i class="ti ti-map-search" style="font-size:44px;opacity:.4;display:block;margin-bottom:10px"></i>${lang==='ko'?'코스가 없어요.':'No courses found.'}</div>`;return}
  el.innerHTML=f.map(c=>{const ti=TI[c.t];const loc=c[lang];return`<div class="card${sel===c.id?' on':''}" onclick="selectC('${c.id}')"><div class="ctop"><div class="cname">${loc.n}</div><div class="cbadge" style="background:${ti.bg};color:${ti.fg}"><i class="ti ${ti.ic}"></i>${ti[lang]}</div></div><div class="cmeta"><span class="mi"><i class="ti ti-map-pin"></i>${c.km}</span><span class="mi"><i class="ti ti-clock"></i>${c.tm[lang]}</span><span class="mi"><i class="ti ti-flame"></i>${c.cal}</span><span class="mi"><i class="ti ti-stairs"></i>${c.dif[lang]}</span></div><div class="ctags">${(loc.tags||[]).map(t=>`<span class="ctag">#${t}</span>`).join('')}</div></div>`}).join('')
}
function selectC(id){
  sel=id;const c=CS.find(x=>x.id===id);const loc=c[lang];const col=DC[c.d]||'#1D9E75';
  document.getElementById('mf').src=c.map;
  document.getElementById('gb').style.display='flex';
  document.getElementById('shT').textContent=loc.n;
  document.getElementById('shTg').textContent=(loc.tags||[]).map(t=>'#'+t).join('  ');
  document.getElementById('shSt').innerHTML=(c.steps||[]).map((s,i)=>`<div class="snode"><div class="scirc" style="background:${col}22;border:2px solid ${col}"><i class="ti ${s.ic}" style="color:${col};font-size:18px"></i></div><div class="slbl">${s[lang]||s.ko}</div><div class="snote">${s.nt[lang]}</div></div>${i<c.steps.length-1?`<div class="sline" style="background:${col}"></div>`:''}`).join('');
  document.getElementById('shStat').innerHTML=[['ti-map-pin',c.km,lang==='ko'?'거리':'Distance'],['ti-clock',c.tm[lang],lang==='ko'?'시간':'Time'],['ti-flame',c.cal,lang==='ko'?'칼로리':'Calories'],['ti-stairs',c.dif[lang],lang==='ko'?'난이도':'Level']].map(([ic,v,l])=>`<div class="sbox"><div class="sval">${v}</div><div class="slbl2">${l}</div></div>`).join('');
  document.getElementById('shP').innerHTML=(c.pois||[]).map(p=>{const ps=PI[p.pt]||PI.rest;const[nm,ds]=p[lang];return`<div class="poi"><div class="poiic" style="background:${ps.bg};color:${ps.fg}"><i class="ti ${p.ic}"></i></div><div><div class="poinm">${nm}</div><div class="poids">${ds}</div></div></div>`}).join('');
  document.querySelector('.poi-ttl').textContent=lang==='ko'?'코스 주변 정보':'Along this route';
  document.querySelector('.btncls').textContent=lang==='ko'?'닫기':'Close';
  document.getElementById('ovl').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  if(window.innerWidth<768)showScreen('map');
  renderList();
}
function closeSheet(){sel=null;document.getElementById('ovl').classList.remove('on');document.getElementById('sheet').classList.remove('on');renderList()}
function openGmap(){if(!sel)return;window.open(CS.find(c=>c.id===sel).gmap,'_blank')}
function showScreen(v){
  const ls=document.getElementById('listScreen'),ms=document.getElementById('mapScreen'),vl=document.getElementById('vtL'),vm=document.getElementById('vtM');
  if(v==='map'){ls.style.display='none';ms.style.display='block';vl.classList.remove('on');vm.classList.add('on')}
  else{ls.style.display='block';ms.style.display='none';vl.classList.add('on');vm.classList.remove('on')}
}
function toggleLang(){
  lang=lang==='ko'?'en':'ko';
  document.getElementById('lbtn').textContent=lang==='ko'?'EN':'한국어';
  document.getElementById('si').placeholder=lang==='ko'?'코스·장소·태그 검색...':'Search courses, places, tags...';
  document.querySelectorAll('[data-ko]').forEach(el=>{el.textContent=el.dataset[lang]||el.dataset.ko});
  buildD();renderList();if(sel)selectC(sel);
}
document.getElementById('si').addEventListener('input',renderList);
buildD();renderList();
</script>
</body>
