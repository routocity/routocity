<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="서울 주요 동네의 걷기·달리기·산책 코스. 맛집·쉼터·화장실 무료 정보. Free walking & running courses in Seoul.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Routocity — 서울 걷기·달리기 코스</title>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signInWithPopup,
      GoogleAuthProvider,
      signOut,
      onAuthStateChanged,
      sendPasswordResetEmail,
      updateProfile
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    // =============================================
    // 🔥 Firebase 설정 — 아래 값을 본인 것으로 교체하세요
    // Firebase Console > 프로젝트 설정 > 앱 > firebaseConfig
    // =============================================
    const firebaseConfig = {
      apiKey: "AIzaSyCzrK-L9ajdRRnqmnRJk40jhrWjTDInJA8",
      authDomain: "routocity.firebaseapp.com",
      projectId: "routocity",
      storageBucket: "routocity.firebasestorage.app",
      messagingSenderId: "170974446812",
      appId: "1:170974446812:web:3e79123dc552429de46019",
      measurementId: "G-W3MLC7J3LT"
    };
    // =============================================

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    // ─── 언어 ─────────────────────────────────
    let lang = localStorage.getItem('rc_lang') || 'ko';
    const t = {
      ko: {
        login: '로그인',
        signup: '회원가입',
        logout: '로그아웃',
        email: '이메일',
        password: '비밀번호',
        passwordConfirm: '비밀번호 확인',
        nickname: '닉네임 (선택)',
        loginBtn: '로그인',
        signupBtn: '회원가입하기',
        googleLogin: 'Google로 계속하기',
        forgotPw: '비밀번호를 잊으셨나요?',
        resetPw: '비밀번호 재설정',
        resetSent: '재설정 링크를 이메일로 보냈어요!',
        noAccount: '계정이 없으신가요?',
        hasAccount: '이미 계정이 있으신가요?',
        loginSuccess: '로그인 성공! 환영해요 😊',
        signupSuccess: '가입 완료! 환영해요 😊',
        logoutSuccess: '로그아웃 됐어요.',
        pwMismatch: '비밀번호가 일치하지 않아요.',
        pwShort: '비밀번호는 6자 이상이어야 해요.',
        emailInvalid: '올바른 이메일을 입력해주세요.',
        emailInUse: '이미 사용 중인 이메일이에요.',
        wrongPw: '이메일 또는 비밀번호가 틀렸어요.',
        userNotFound: '등록된 이메일이 없어요.',
        tooManyReq: '잠시 후 다시 시도해주세요.',
        resetEmailSent: '입력한 이메일로 재설정 링크를 보냈어요!',
        mypage: '마이페이지',
      },
      en: {
        login: 'Login',
        signup: 'Sign Up',
        logout: 'Logout',
        email: 'Email',
        password: 'Password',
        passwordConfirm: 'Confirm Password',
        nickname: 'Nickname (optional)',
        loginBtn: 'Log In',
        signupBtn: 'Create Account',
        googleLogin: 'Continue with Google',
        forgotPw: 'Forgot password?',
        resetPw: 'Reset Password',
        resetSent: 'Reset link sent to your email!',
        noAccount: "Don't have an account?",
        hasAccount: 'Already have an account?',
        loginSuccess: 'Welcome back! 😊',
        signupSuccess: 'Account created! Welcome 😊',
        logoutSuccess: 'You have been logged out.',
        pwMismatch: 'Passwords do not match.',
        pwShort: 'Password must be at least 6 characters.',
        emailInvalid: 'Please enter a valid email.',
        emailInUse: 'This email is already in use.',
        wrongPw: 'Incorrect email or password.',
        userNotFound: 'No account found with this email.',
        tooManyReq: 'Too many attempts. Please try again later.',
        resetEmailSent: 'Password reset link sent to your email!',
        mypage: 'My Page',
      }
    };

    function i(key) { return t[lang][key] || key; }

    // ─── Auth 상태 감지 ──────────────────────────
    onAuthStateChanged(auth, (user) => {
      updateAuthUI(user);
    });

    function updateAuthUI(user) {
      const authBtn = document.getElementById('auth-btn');
      const userMenu = document.getElementById('user-menu');
      const userAvatar = document.getElementById('user-avatar');
      if (!authBtn) return;

      if (user) {
        authBtn.style.display = 'none';
        userMenu.style.display = 'flex';
        const initials = (user.displayName || user.email || '?')[0].toUpperCase();
        userAvatar.textContent = user.photoURL
          ? ''
          : initials;
        if (user.photoURL) {
          userAvatar.style.backgroundImage = `url(${user.photoURL})`;
          userAvatar.style.backgroundSize = 'cover';
          userAvatar.style.backgroundPosition = 'center';
        } else {
          userAvatar.style.backgroundImage = 'none';
        }
        userAvatar.title = user.displayName || user.email;
      } else {
        authBtn.style.display = 'flex';
        userMenu.style.display = 'none';
      }
      refreshI18n();
    }

    // ─── 모달 열기/닫기 ─────────────────────────
    window.openAuthModal = function(mode = 'login') {
      document.getElementById('auth-modal').classList.add('open');
      window.switchMode(mode);
    };

    window.closeAuthModal = function() {
      document.getElementById('auth-modal').classList.remove('open');
      clearErrors();
    };

    window.switchMode = function(mode) {
      document.getElementById('modal-login').style.display  = mode === 'login'  ? 'block' : 'none';
      document.getElementById('modal-signup').style.display = mode === 'signup' ? 'block' : 'none';
      document.getElementById('modal-reset').style.display  = mode === 'reset'  ? 'block' : 'none';
      clearErrors();
    };

    // ─── 이메일 로그인 ───────────────────────────
    window.handleLogin = async function() {
      const email = document.getElementById('login-email').value.trim();
      const pw    = document.getElementById('login-pw').value;
      clearErrors();
      try {
        await signInWithEmailAndPassword(auth, email, pw);
        closeAuthModal();
        showToast(i('loginSuccess'));
      } catch (e) {
        showFieldError('login-err', firebaseErrMsg(e.code));
      }
    };

    // ─── 이메일 회원가입 ─────────────────────────
    window.handleSignup = async function() {
      const email    = document.getElementById('signup-email').value.trim();
      const pw       = document.getElementById('signup-pw').value;
      const pw2      = document.getElementById('signup-pw2').value;
      const nickname = document.getElementById('signup-name').value.trim();
      clearErrors();
      if (pw.length < 6)  { showFieldError('signup-err', i('pwShort'));    return; }
      if (pw !== pw2)     { showFieldError('signup-err', i('pwMismatch')); return; }
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pw);
        if (nickname) await updateProfile(cred.user, { displayName: nickname });
        closeAuthModal();
        showToast(i('signupSuccess'));
      } catch (e) {
        showFieldError('signup-err', firebaseErrMsg(e.code));
      }
    };

    // ─── 구글 로그인 ─────────────────────────────
    window.handleGoogle = async function() {
      clearErrors();
      try {
        await signInWithPopup(auth, googleProvider);
        closeAuthModal();
        showToast(i('loginSuccess'));
      } catch (e) {
        if (e.code !== 'auth/popup-closed-by-user') {
          showFieldError('login-err', firebaseErrMsg(e.code));
          showFieldError('signup-err', firebaseErrMsg(e.code));
        }
      }
    };

    // ─── 비밀번호 재설정 ─────────────────────────
    window.handleReset = async function() {
      const email = document.getElementById('reset-email').value.trim();
      clearErrors();
      try {
        await sendPasswordResetEmail(auth, email);
        showFieldError('reset-err', i('resetEmailSent'), true);
      } catch (e) {
        showFieldError('reset-err', firebaseErrMsg(e.code));
      }
    };

    // ─── 로그아웃 ────────────────────────────────
    window.handleLogout = async function() {
      await signOut(auth);
      showToast(i('logoutSuccess'));
    };

    // ─── Firebase 에러 메시지 한글화 ─────────────
    function firebaseErrMsg(code) {
      const map = {
        'auth/email-already-in-use':    i('emailInUse'),
        'auth/invalid-email':           i('emailInvalid'),
        'auth/wrong-password':          i('wrongPw'),
        'auth/user-not-found':          i('userNotFound'),
        'auth/too-many-requests':       i('tooManyReq'),
        'auth/invalid-credential':      i('wrongPw'),
        'auth/weak-password':           i('pwShort'),
      };
      return map[code] || code;
    }

    // ─── UI 헬퍼 ─────────────────────────────────
    function showFieldError(id, msg, success = false) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = msg;
      el.style.color = success ? '#22c55e' : '#ef4444';
      el.style.display = 'block';
    }
    function clearErrors() {
      ['login-err','signup-err','reset-err'].forEach(id => {
        const el = document.getElementById(id);
        if (el) { el.textContent = ''; el.style.display = 'none'; }
      });
    }

    window.showToast = function(msg) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    };

    // ─── i18n 새로고침 ───────────────────────────
    window.setLang = function(l) {
      lang = l;
      localStorage.setItem('rc_lang', l);
      refreshI18n();
    };

    function refreshI18n() {
      document.querySelectorAll('[data-ko]').forEach(el => {
        el.textContent = lang === 'ko' ? el.dataset.ko : el.dataset.en;
      });
      const authBtn = document.getElementById('auth-btn');
      if (authBtn) {
        authBtn.querySelector('.auth-btn-text').textContent = i('login') + ' / ' + i('signup');
      }
      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) logoutBtn.title = i('logout');

      // 모달 텍스트
      setTxt('lbl-login-email',   i('email'));
      setTxt('lbl-login-pw',      i('password'));
      setTxt('lbl-signup-email',  i('email'));
      setTxt('lbl-signup-pw',     i('password'));
      setTxt('lbl-signup-pw2',    i('passwordConfirm'));
      setTxt('lbl-signup-name',   i('nickname'));
      setTxt('lbl-reset-email',   i('email'));
      setVal('btn-login',         i('loginBtn'));
      setVal('btn-signup',        i('signupBtn'));
      setTxt('link-forgot',       i('forgotPw'));
      setTxt('link-no-account',   i('noAccount'));
      setTxt('link-has-account',  i('hasAccount'));
      setTxt('link-back-login',   '← ' + i('login'));
      setTxt('modal-reset-title', i('resetPw'));
      setVal('btn-reset',         i('resetPw'));
      setTxt('google-login-text', i('googleLogin'));
      setTxt('google-signup-text',i('googleLogin'));
    }

    function setTxt(id, v) { const el = document.getElementById(id); if(el) el.textContent = v; }
    function setVal(id, v) { const el = document.getElementById(id); if(el) el.value !== undefined ? el.textContent = v : el.textContent = v; }

    // 언어 토글 버튼
    document.addEventListener('DOMContentLoaded', () => {
      const langBtn = document.getElementById('lang-btn');
      if (langBtn) {
        langBtn.addEventListener('click', () => {
          setLang(lang === 'ko' ? 'en' : 'ko');
          langBtn.textContent = lang === 'ko' ? 'EN' : 'KO';
        });
        langBtn.textContent = lang === 'ko' ? 'EN' : 'KO';
      }
      // Enter 키 지원
      document.getElementById('login-pw')?.addEventListener('keydown', e => { if(e.key==='Enter') handleLogin(); });
      document.getElementById('signup-pw2')?.addEventListener('keydown', e => { if(e.key==='Enter') handleSignup(); });
      document.getElementById('reset-email')?.addEventListener('keydown', e => { if(e.key==='Enter') handleReset(); });

      refreshI18n();
    });

  </script>

  <style>
    /* ── Reset & Base ─────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: #e2e0db;
      --text: #1a1a1a;
      --text-sub: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #ef4444;
      --success: #22c55e;
      --google: #ffffff;
      --google-border: #dadce0;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.12);
      --header-h: 52px;
    }
    html, body { height: 100%; width: 100%; overflow: hidden; font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; background: var(--bg); color: var(--text); }

    /* ── Header ───────────────────────────── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 16px; gap: 12px;
    }
    .logo {
      font-size: 18px; font-weight: 800; letter-spacing: -0.5px;
      color: var(--text); text-decoration: none; flex: 1;
    }
    .logo span { color: var(--accent); }

    /* ── 언어 버튼 ────────────────────────── */
    #lang-btn {
      font-size: 12px; font-weight: 600; padding: 5px 10px;
      border: 1px solid var(--border); border-radius: 20px;
      background: transparent; cursor: pointer; color: var(--text-sub);
      transition: all .2s;
    }
    #lang-btn:hover { background: var(--bg); color: var(--text); }

    /* ── 로그인 버튼 ──────────────────────── */
    #auth-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 20px;
      background: var(--accent); color: #fff;
      font-size: 13px; font-weight: 600;
      border: none; cursor: pointer; transition: background .2s;
      white-space: nowrap;
    }
    #auth-btn:hover { background: var(--accent-hover); }
    #auth-btn svg { flex-shrink: 0; }

    /* ── 유저 메뉴 ────────────────────────── */
    #user-menu {
      display: none; align-items: center; gap: 8px;
    }
    #user-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--accent); color: #fff;
      font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none; overflow: hidden;
    }
    #logout-btn {
      padding: 6px 12px; border-radius: 20px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-sub); font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all .2s;
    }
    #logout-btn:hover { background: var(--bg); color: var(--danger); border-color: var(--danger); }

    /* ── 지도 영역 ────────────────────────── */
    #map-wrap {
      position: fixed; top: var(--header-h); left: 0; right: 0; bottom: 0;
    }
    #map-wrap iframe {
      width: 100%; height: 100%; border: none; display: block;
    }

    /* ── 모달 오버레이 ────────────────────── */
    #auth-modal {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.45); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; padding: 16px;
    }
    #auth-modal.open { display: flex; animation: fadeIn .2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-box {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%; max-width: 400px;
      padding: 32px 28px 28px;
      animation: slideUp .25s ease;
      position: relative;
    }
    @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

    .modal-close {
      position: absolute; top: 16px; right: 16px;
      width: 28px; height: 28px; border-radius: 50%;
      border: none; background: var(--bg); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-sub); font-size: 16px; transition: background .15s;
    }
    .modal-close:hover { background: var(--border); }

    .modal-title {
      font-size: 22px; font-weight: 800; margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .modal-subtitle {
      font-size: 13px; color: var(--text-sub); margin-bottom: 24px;
    }

    /* ── 구글 버튼 ────────────────────────── */
    .google-btn {
      width: 100%; padding: 11px 16px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      border: 1px solid var(--google-border); border-radius: 8px;
      background: var(--google); cursor: pointer;
      font-size: 14px; font-weight: 500; color: #3c4043;
      transition: background .15s, box-shadow .15s; margin-bottom: 20px;
    }
    .google-btn:hover { background: #f8f8f8; box-shadow: 0 1px 4px rgba(0,0,0,.12); }

    /* ── 구분선 ───────────────────────────── */
    .divider {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px; color: var(--text-sub); font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── 폼 ───────────────────────────────── */
    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text-sub); margin-bottom: 5px; letter-spacing: 0.3px;
    }
    .field input {
      width: 100%; padding: 11px 13px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; background: var(--bg); color: var(--text);
      outline: none; transition: border-color .15s;
    }
    .field input:focus { border-color: var(--accent); background: #fff; }

    /* ── 에러/성공 메시지 ─────────────────── */
    .field-err {
      display: none; font-size: 12px; margin-top: 12px;
      padding: 8px 12px; border-radius: 6px;
      background: #fef2f2; color: var(--danger);
    }

    /* ── 기본 버튼 ────────────────────────── */
    .btn-primary {
      width: 100%; padding: 12px;
      background: var(--accent); color: #fff;
      font-size: 15px; font-weight: 700;
      border: none; border-radius: 8px; cursor: pointer;
      transition: background .15s; margin-top: 4px;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    /* ── 하단 링크 ────────────────────────── */
    .modal-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 18px; flex-wrap: wrap; gap: 6px;
    }
    .modal-footer a, .modal-link {
      font-size: 13px; color: var(--accent);
      cursor: pointer; text-decoration: none;
    }
    .modal-footer a:hover, .modal-link:hover { text-decoration: underline; }

    /* ── 토스트 ───────────────────────────── */
    #toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #1a1a1a; color: #fff;
      padding: 10px 20px; border-radius: 100px;
      font-size: 14px; font-weight: 500;
      opacity: 0; transition: all .3s; z-index: 999;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── 모바일 ───────────────────────────── */
    @media (max-width: 480px) {
      .modal-box { padding: 24px 20px 20px; }
      .modal-title { font-size: 20px; }
    }
  </style>
</head>
<body>

  <!-- ── 헤더 ──────────────────────────────────── -->
  <header>
    <a class="logo" href="/">Rout<span>o</span>city</a>

    <button id="lang-btn">EN</button>

    <!-- 비로그인 상태 -->
    <button id="auth-btn" onclick="openAuthModal('login')">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="auth-btn-text">로그인 / 회원가입</span>
    </button>

    <!-- 로그인 상태 -->
    <div id="user-menu">
      <div id="user-avatar" title="내 계정"></div>
      <button id="logout-btn" onclick="handleLogout()" title="로그아웃">로그아웃</button>
    </div>
  </header>

  <!-- ── 지도 ──────────────────────────────────── -->
  <div id="map-wrap">
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d50000!2d126.978!3d37.563!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sko!2skr!4v1700000000000"
      allowfullscreen loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <!-- ── 인증 모달 ──────────────────────────────── -->
  <div id="auth-modal" onclick="if(event.target===this)closeAuthModal()">
    <div class="modal-box">
      <button class="modal-close" onclick="closeAuthModal()">✕</button>

      <!-- ─ 로그인 탭 ─ -->
      <div id="modal-login">
        <div class="modal-title">로그인</div>
        <div class="modal-subtitle">Routocity에 오신 걸 환영해요!</div>

        <!-- Google -->
        <button class="google-btn" onclick="handleGoogle()">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
          <span id="google-login-text">Google로 계속하기</span>
        </button>

        <div class="divider">또는</div>

        <div class="field">
          <label id="lbl-login-email">이메일</label>
          <input id="login-email" type="email" placeholder="hello@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label id="lbl-login-pw">비밀번호</label>
          <input id="login-pw" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div id="login-err" class="field-err"></div>

        <button id="btn-login" class="btn-primary" onclick="handleLogin()">로그인</button>

        <div class="modal-footer">
          <span class="modal-link" id="link-forgot" onclick="switchMode('reset')">비밀번호를 잊으셨나요?</span>
          <span>
            <span id="link-no-account" style="color:var(--text-sub);font-size:13px">계정이 없으신가요?</span>
            <a onclick="switchMode('signup')"> 회원가입</a>
          </span>
        </div>
      </div>

      <!-- ─ 회원가입 탭 ─ -->
      <div id="modal-signup" style="display:none">
        <div class="modal-title">회원가입</div>
        <div class="modal-subtitle">무료로 시작하세요!</div>

        <!-- Google -->
        <button class="google-btn" onclick="handleGoogle()">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
          <span id="google-signup-text">Google로 계속하기</span>
        </button>

        <div class="divider">또는</div>

        <div class="field">
          <label id="lbl-signup-email">이메일</label>
          <input id="signup-email" type="email" placeholder="hello@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label id="lbl-signup-pw">비밀번호</label>
          <input id="signup-pw" type="password" placeholder="6자 이상" autocomplete="new-password">
        </div>
        <div class="field">
          <label id="lbl-signup-pw2">비밀번호 확인</label>
          <input id="signup-pw2" type="password" placeholder="••••••••" autocomplete="new-password">
        </div>
        <div class="field">
          <label id="lbl-signup-name">닉네임 (선택)</label>
          <input id="signup-name" type="text" placeholder="예: 홍길동" autocomplete="nickname">
        </div>
        <div id="signup-err" class="field-err"></div>

        <button id="btn-signup" class="btn-primary" onclick="handleSignup()">회원가입하기</button>

        <div class="modal-footer" style="justify-content:center">
          <span id="link-has-account" style="color:var(--text-sub);font-size:13px">이미 계정이 있으신가요?</span>
          <a onclick="switchMode('login')"> 로그인</a>
        </div>
      </div>

      <!-- ─ 비밀번호 재설정 탭 ─ -->
      <div id="modal-reset" style="display:none">
        <div class="modal-title" id="modal-reset-title">비밀번호 재설정</div>
        <div class="modal-subtitle">가입하신 이메일로 재설정 링크를 보내드려요.</div>

        <div class="field">
          <label id="lbl-reset-email">이메일</label>
          <input id="reset-email" type="email" placeholder="hello@example.com" autocomplete="email">
        </div>
        <div id="reset-err" class="field-err"></div>

        <button id="btn-reset" class="btn-primary" onclick="handleReset()">재설정 링크 보내기</button>

        <div class="modal-footer" style="justify-content:center; margin-top:16px">
          <span class="modal-link" id="link-back-login" onclick="switchMode('login')">← 로그인으로</span>
        </div>
      </div>

    </div>
  </div>

  <!-- ── 토스트 메시지 ──────────────────────────── -->
  <div id="toast"></div>

</body>
</html>
